name: Exact model compatibility request
description: Propose support for another exact DMI/BIOS/EC combination
title: "Compatibility: "
labels: [compatibility]
body:
  - type: markdown
    attributes:
      value: |
        Do not upload serial numbers, private keys, full journals, or raw EC dumps.
  - type: input
    id: product
    attributes:
      label: DMI product name
    validations:
      required: true
  - type: input
    id: board
    attributes:
      label: DMI board name
    validations:
      required: true
  - type: input
    id: bios
    attributes:
      label: BIOS version
    validations:
      required: true
  - type: input
    id: ec
    attributes:
      label: EC firmware
    validations:
      required: true
  - type: input
    id: kernel
    attributes:
      label: Distribution and kernel
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Read-only evidence and validation completed
      description: Do not probe or write unknown EC addresses.
    validations:
      required: true
