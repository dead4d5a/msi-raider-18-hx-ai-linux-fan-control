name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Syntax, policies, compiled snapshot harness, ShellCheck and integrity
        run: ./scripts/verify-release.sh

  driver-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Pinned upstream driver
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: BeardOverflow/msi-ec
          ref: d7fbbd88e6831e56801b860e46475cbf8ddbc7c1
          path: .driver-build-source
          persist-credentials: false
      - name: Build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential linux-headers-generic kmod
      - name: Verify patch and build without installing or loading
        shell: bash
        run: |
          kernel_release=$(./scripts/select-ci-kernel.sh)
          printf 'Selected generic kernel headers: %s\n' "$kernel_release"
          ./scripts/verify-driver-build.sh .driver-build-source "$kernel_release"
